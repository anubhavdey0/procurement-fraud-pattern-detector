.viz-context-line { stroke: #6f6e69; stroke-width: 1; fill: none; }
.viz-whisker { stroke: #6f6e69; stroke-width: 2; stroke-linecap: round; }
.viz-ring { stroke: #1a1a19; stroke-width: 2; }
.viz-hit { fill: transparent; stroke: none; cursor: default; outline: none; }
.viz-hit:hover + .viz-mark, .viz-hit:focus-visible + .viz-mark { filter: brightness(1.18); }
