.viz-note { fill: #c3c2b7; font-size: 11px; }
.viz-grid { stroke: #2c2c2a; stroke-width: 1; }
.viz-axis { stroke: #383835; stroke-width: 1; }
.viz-ref { stroke: #898781; stroke-width: 1; }
.viz-s1 { fill: #3987e5; }
