<svg class="viz" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320" role="group" aria-label="How well the variance screen separates cartel tenders, by case"><desc>Dot and whisker chart. One row per documented cartel case. The dot is the AUC of the coefficient of variation screen with a 95% bootstrap interval. 0.5 is a coin toss.</desc><style>
.viz text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.viz-title { fill: #f0efec; font-size: 14px; font-weight: 600; }
